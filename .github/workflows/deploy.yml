name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # 잔디 갱신용 주 1회 재배포 (일 21:17 UTC = 월 06:17 KST).
  # contributions.json 은 커밋하지 않고 이 워크플로가 배포 때마다 새로 만들므로,
  # 갱신하려면 "다시 배포"하는 것이 유일한 방법입니다.
  # 정시를 피한 것은 매시 정각에 몰리는 스케줄 큐를 피하기 위해서입니다.
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      # 🔴 lock 을 지우지 마세요 — `npm ci` 로 lock 그대로 설치합니다.
      #    예전에는 rollup 네이티브 모듈 누락(npm/cli#4828) 때문에 lock 을 지우고
      #    `npm install` 했는데, 그러면 매 실행마다 범위 안 최신 버전이 깔립니다.
      #    실제로 @types/markdown-it 14.2.0 이 들어와 tsc 가 깨졌습니다(2026-08-23~).
      #    linux·darwin 플랫폼 항목은 이제 lock 에 들어 있습니다.
      #    @types/markdown-it 은 package.json 에서 14.1.2 로 정확히 고정했습니다
      #    (14.2.0 은 @types/markdown-it-footnote 와 타입이 맞지 않음).
      - name: Install dependencies
        run: npm ci
        
      # 🔴 Build 보다 먼저. public/ 은 vite 가 그대로 dist/ 로 복사하므로
      #    빌드 전에 만들어 두어야 배포물에 들어갑니다.
      #
      #    토큰을 쓰지 않습니다 — 공개 잔디 조각을 읽습니다. 따라서 이 워크플로에
      #    추가로 필요한 시크릿·권한이 없습니다.
      #
      #    실패해도 배포는 계속됩니다. 스크립트 자체가 종료 코드 0 으로 끝내고,
      #    continue-on-error 가 그 위의 안전망입니다. 파일이 없으면 화면은
      #    `기여 활동을 불러오지 못했어요` 회복 카드로 폴백합니다.
      - name: Generate contributions data
        continue-on-error: true
        run: npm run generate-contributions-data

      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5