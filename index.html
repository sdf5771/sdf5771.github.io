<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <!--
      테마 부트스트랩. 모든 CSS·React 보다 먼저 실행돼야 합니다.
      React 마운트를 기다리면 다크 사용자가 매 진입마다 흰 화면 섬광(FOUC)을 봅니다.
      localStorage["theme"]("system" | "light" | "dark") 를 해석해
      <html data-theme> 에 실제 적용값만 씁니다.
      근거: docs/handoff-step1-shell.md §5-2
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme') || 'system';
          var d =
            s === 'dark' ||
            (s === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!--
      워드마크·히어로 이름이 이 서체로 그려지므로 LCP 요소가 여기에 걸립니다(§4-4).
      CSS 를 파싱한 뒤에야 폰트 요청이 시작되면 그만큼 늦으므로 미리 받습니다.
      경로에 /src/ 가 들어가는 이유: Vite 가 빌드 때 해시가 붙은 실제 자산 경로로
      바꿔 줍니다. 손으로 /assets/... 를 적으면 해시가 바뀌는 순간 404 가 됩니다.
      GalmuriMono11 은 preload 하지 않습니다 — 헤더 경로·⌘K 같은 작은 보조 텍스트라
      LCP 에 걸리지 않고, 대역폭을 LCP 쪽에 몰아 주는 편이 낫습니다.
    -->
    <link
      rel="preload"
      href="/src/assets/fonts/Galmuri11-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="공부하거나 조사한 내용을 기록합니다. 프론트엔드, 브라우저, 그 사이의 이야기." />

    <meta name="keywords" content="Seobisback, Blog, Frontend, Developer, JavaScript, TypeScript, React, Next.js, Tailwind CSS, HTML, CSS, Web Development" />
    <meta name="og:title" content="Seobisback.log — 프론트엔드 개발자 김섭우" />
    <meta name="og:description" content="공부하는 기술, 경험에 대한 이야기를 정리해요." />
    <meta name="og:image" content="/favicon.ico" />
    <meta name="og:url" content="https://sdf5771.github.io" />
    <meta name="og:site_name" content="Seobisback.log" />
    <meta name="og:type" content="website" />
    <meta name="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />

  </head>
